name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: PHP Lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.4 = minimo dichiarato nel plugin header; 8.3 = versione corrente.
        php: [ '7.4', '8.3' ]
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Syntax check
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0 \
            | xargs -0 -n1 -P4 php -l

  js:
    name: JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: node --check
        run: |
          find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check

  privacy:
    name: Nessuna richiesta a Google Fonts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Privacy by design: la pagina di login non deve contattare terzi.
      # I soli riferimenti ammessi sono i commenti che documentano il divieto.
      - name: Grep fonts.googleapis.com / fonts.gstatic.com
        run: |
          if grep -rnE "https?://fonts\.(googleapis|gstatic)\.com" --include='*.php' --include='*.js' --include='*.css' .; then
            echo "::error::Trovato un URL di Google Fonts: i font vanno serviti dal sito."
            exit 1
          fi
